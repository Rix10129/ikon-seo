name: SEO Services Dubai rollout

on:
  pull_request:
    paths:
      - 'production/seo-services-dubai/**'
      - 'tests/seo-services-dubai-rollout-test.php'
      - '.github/workflows/seo-services-dubai-rollout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-rollout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Lint rollout plugin
        run: php -l production/seo-services-dubai/ikon-seo-services-dubai-rollout.php
      - name: Run rollout safety checks
        run: php tests/seo-services-dubai-rollout-test.php
